<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="AITracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- The clock face, open where the spark sits. -->
  <path d="M 790.9 487.6 A 280 280 0 1 1 584.5 241.5"
        fill="none" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round" opacity="0.97"/>

  <!-- The hand, pointing at the hour the assistant was working. -->
  <path d="M 512 512 L 657 381" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="38" fill="#FFFFFF"/>

  <!-- The spark: the machine half of the hour. -->
  <g transform="translate(726 332) scale(0.8)">
    <path d="M 0 -104 C 12 -34 34 -12 104 0 C 34 12 12 34 0 104 C -12 34 -34 12 -104 0 C -34 -12 -12 -34 0 -104 Z"
          fill="url(#spark)"/>
  </g>
</svg>
