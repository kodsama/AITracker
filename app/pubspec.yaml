name: aitracker
description: >-
  AITracker - see the hours you spend with an AI assistant, and file them into
  WorkingHours, Diarium or a spreadsheet.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  aitracker_engine:
  aitracker_mcp:
  cupertino_icons: ^1.0.8
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqlite3: ^3.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  macos:
    generate: true
    image_path: assets/logo/icon.png
